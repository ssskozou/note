<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>本格花火大会シミュレーター（全11種類）</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050510;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* コントロールパネル */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 600px;
            background: rgba(10, 10, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 10;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        select, button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        select:hover, button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        button.active {
            background: #ff4757;
            border-color: #ff6b81;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }
        .label {
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #instruction {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #ddd;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
            text-align: center;
            white-space: nowrap;
        }
        @media (max-width: 480px) {
            #ui-layer {
                bottom: 10px;
                padding: 10px;
            }
            select, button {
                font-size: 12px;
                padding: 6px 8px;
            }
            #instruction {
                font-size: 11px;
                top: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="instruction">✨ 画面をタップまたはクリックして花火を打ち上げよう！</div>

    <div id="ui-layer">
        <div class="control-row">
            <div class="label">花火の種類:</div>
            <select id="fireworkType">
                <option value="random">🌟 ランダム（おまかせ）</option>
                <option value="kiku">菊（きく / 変化菊）</option>
                <option value="botan">牡丹（ぼたん / ダリヤ）</option>
                <option value="kamuro">冠（かむろ）</option>
                <option value="katamono">型物（ハート・星）</option>
                <option value="mangekyo">万華鏡（八方咲き）</option>
                <option value="senrin">千輪（時間差小玉連続）</option>
                <option value="yashi">椰子（太く豪快な葉）</option>
                <option value="hiyuusei">飛遊星（不規則に飛び回る）</option>
                <option value="hachi">蜂（回転してシュルシュル）</option>
                <option value="hanarai">花雷（雷鳴と激しい火花）</option>
                <option value="yanagi">柳（彩色柳・ゆっくり垂れ下がる）</option>
            </select>
            <button id="starmineBtn">🎆 スターマイン（自動連発）</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const typeSelect = document.getElementById('fireworkType');
        const starmineBtn = document.getElementById('starmineBtn');

        let isStarmine = false;
        let starmineTimer = null;

        starmineBtn.addEventListener('click', () => {
            isStarmine = !isStarmine;
            if (isStarmine) {
                starmineBtn.classList.add('active');
                starmineBtn.textContent = '⏹ スターマイン停止';
                startStarmine();
            } else {
                starmineBtn.classList.remove('active');
                starmineBtn.textContent = '🎆 スターマイン（自動連発）';
                clearInterval(starmineTimer);
            }
        });

        function startStarmine() {
            starmineTimer = setInterval(() => {
                const x = Math.random() * (width * 0.8) + (width * 0.1);
                const targetY = Math.random() * (height * 0.4) + (height * 0.15);
                const types = ['kiku', 'botan', 'kamuro', 'katamono', 'mangekyo', 'senrin', 'yashi', 'hiyuusei', 'hachi', 'hanarai', 'yanagi'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                
                fireworks.push(new Rocket(x, height, targetY, randomType));
                
                // たまにダブル打ち上げ
                if (Math.random() < 0.4) {
                    setTimeout(() => {
                        const x2 = Math.random() * (width * 0.8) + (width * 0.1);
                        const targetY2 = Math.random() * (height * 0.4) + (height * 0.15);
                        const randomType2 = types[Math.floor(Math.random() * types.length)];
                        fireworks.push(new Rocket(x2, height, targetY2, randomType2));
                    }, 200);
                }
            }, 700);
        }

        // 打ち上げ位置タップ
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#ui-layer') || e.target.closest('#instruction')) return;
            const x = e.clientX;
            const targetY = Math.max(80, e.clientY);
            const selectedType = typeSelect.value;
            
            const types = ['kiku', 'botan', 'kamuro', 'katamono', 'mangekyo', 'senrin', 'yashi', 'hiyuusei', 'hachi', 'hanarai', 'yanagi'];
            const type = selectedType === 'random' ? types[Math.floor(Math.random() * types.length)] : selectedType;
            
            fireworks.push(new Rocket(x, height, targetY, type));
        });

        class Rocket {
            constructor(x, y, targetY, type) {
                this.x = x;
                this.y = y;
                this.targetY = targetY;
                this.type = type;
                this.speed = 12 + Math.random() * 3;
                this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.15;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed;
                this.trail = [];
                this.hue = Math.random() * 360;
                this.exploded = false;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.15; // 重力

                if (this.vy >= 0 || this.y <= this.targetY) {
                    this.explode();
                    return true;
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.trail[0]?.x || this.x, this.trail[0]?.y || this.y);
                for (let t of this.trail) {
                    ctx.lineTo(t.x, t.y);
                }
                ctx.strokeStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            explode() {
                createExplosion(this.x, this.y, this.type, this.hue);
            }
        }

        class Particle {
            constructor(x, y, vx, vy, color, type, options = {}) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.type = type;
                this.alpha = 1;
                this.friction = options.friction || 0.96;
                this.gravity = options.gravity || 0.08;
                this.decay = options.decay || (0.01 + Math.random() * 0.015);
                this.size = options.size || 2.5;
                this.trailLength = options.trailLength || 5;
                this.trail = [];
                this.secondStage = options.secondStage || false;
                this.secondaryTimer = options.secondaryTimer || 40;
                this.sparkle = options.sparkle || false;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > this.trailLength) this.trail.shift();

                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;

                // 特殊挙動: 飛遊星（不規則に曲がる）
                if (this.type === 'hiyuusei') {
                    this.vx += (Math.random() - 0.5) * 1.2;
                    this.vy += (Math.random() - 0.5) * 1.2;
                }

                // 特殊挙動: 蜂（らせん・旋回）
                if (this.type === 'hachi') {
                    const angle = Math.random() * Math.PI * 2;
                    this.vx += Math.cos(angle) * 0.8;
                    this.vy += Math.sin(angle) * 0.8;
                }

                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                // 千輪などの二次炸裂
                if (this.secondStage && !this.explodedSecond && this.secondaryTimer-- <= 0) {
                    this.explodedSecond = true;
                    for (let i = 0; i < 8; i++) {
                        const angle = (Math.PI * 2 / 8) * i;
                        const speed = 1 + Math.random() * 2;
                        particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#fff', 'normal', { size: 1.5, decay: 0.03 }));
                    }
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let t of this.trail) {
                        ctx.lineTo(t.x, t.y);
                    }
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size;
                    ctx.stroke();
                }

                ctx.fillStyle = this.sparkle && Math.random() < 0.5 ? '#ffffff' : this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let fireworks = [];
        let particles = [];

        function createExplosion(x, y, type, baseHue) {
            const particleCount = type === 'senrin' ? 40 : 120;
            const color1 = `hsl(${baseHue}, 100%, 60%)`;
            const color2 = `hsl(${(baseHue + 40) % 360}, 100%, 70%)`;
            const colorGold = '#ffd700';
            const colorSilver = '#e0e0e0';

            // 本物の花火大会のような「崩れ」「非対称性」を出すためのランダム係数
            const asymmetryFactor = 0.85 + Math.random() * 0.3;

            switch (type) {
                case 'kiku': // 菊（変化菊：外側で色が変わる）
                    for (let i = 0; i < 110; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = (3 + Math.random() * 5) * asymmetryFactor;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, i % 2 === 0 ? color1 : color2, 'kiku', {
                            friction: 0.95,
                            gravity: 0.07,
                            decay: 0.012,
                            trailLength: 7,
                            size: 2.2
                        }));
                    }
                    break;

                case 'botan': // 牡丹（尾を引かずくっきり明るいダリヤ風）
                    for (let i = 0; i < 100; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = (4 + Math.random() * 4) * asymmetryFactor;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color1, 'botan', {
                            friction: 0.93,
                            gravity: 0.09,
                            decay: 0.018,
                            trailLength: 2,
                            size: 2.8,
                            sparkle: true
                        }));
                    }
                    break;

                case 'kamuro': // 冠（金色や銀色の長い尾を引き重力で大きく垂れ下がる）
                    for (let i = 0; i < 90; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = (2.5 + Math.random() * 3.5);
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, colorGold, 'kamuro', {
                            friction: 0.97,
                            gravity: 0.04, // 軽い重力で長く残る
                            decay: 0.008,  // 消えにくい
                            trailLength: 12,
                            size: 2.5
                        }));
                    }
                    break;

                case 'katamono': // 型物（ハートや星型などの不規則な幾何学展開）
                    for (let i = 0; i < 90; i++) {
                        const t = (i / 90) * Math.PI * 2;
                        // ハートの数式パラメータ
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                        const scale = 0.25 * asymmetryFactor;
                        particles.push(new Particle(x, y, hx * scale, hy * scale, color2, 'katamono', {
                            friction: 0.94,
                            gravity: 0.06,
                            decay: 0.015,
                            trailLength: 4,
                            size: 2.5
                        }));
                    }
                    break;

                case 'mangekyo': // 万華鏡（八方咲き：複数のかたまりが放射状に）
                    for (let cluster = 0; cluster < 6; cluster++) {
                        const clusterAngle = (Math.PI * 2 / 6) * cluster;
                        const cx = Math.cos(clusterAngle) * 3;
                        const cy = Math.sin(clusterAngle) * 3;
                        for (let i = 0; i < 20; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = 1 + Math.random() * 2.5;
                            particles.push(new Particle(x, y, cx + Math.cos(angle) * speed, cy + Math.sin(angle) * speed, color1, 'mangekyo', {
                                friction: 0.95,
                                gravity: 0.07,
                                decay: 0.014,
                                trailLength: 5,
                                size: 2
                            }));
                        }
                    }
                    break;

                case 'senrin': // 千輪（大玉から時間差で小玉が次々開く）
                    for (let i = 0; i < 15; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 4;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, colorGold, 'senrin', {
                            friction: 0.94,
                            gravity: 0.08,
                            decay: 0.02,
                            trailLength: 4,
                            size: 2,
                            secondStage: true,
                            secondaryTimer: 20 + Math.random() * 30
                        }));
                    }
                    break;

                case 'yashi': // 椰子（太く豪快な光の葉が広がる）
                    for (let i = 0; i < 70; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = (5 + Math.random() * 3) * asymmetryFactor;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#d4af37', 'yashi', {
                            friction: 0.95,
                            gravity: 0.1,
                            decay: 0.01,
                            trailLength: 10,
                            size: 3.5
                        }));
                    }
                    break;

                case 'hiyuusei': // 飛遊星（不規則にあちこちへ飛び回る）
                    for (let i = 0; i < 50; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 3 + Math.random() * 4;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#00ffff', 'hiyuusei', {
                            friction: 0.98,
                            gravity: 0.05,
                            decay: 0.01,
                            trailLength: 8,
                            size: 2.5
                        }));
                    }
                    break;

                case 'hachi': // 蜂（回転してシュルシュル動き回る）
                    for (let i = 0; i < 25; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 4 + Math.random() * 3;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#ff00ff', 'hachi', {
                            friction: 0.96,
                            gravity: 0.06,
                            decay: 0.012,
                            trailLength: 6,
                            size: 2.5
                        }));
                    }
                    break;

                case 'hanarai': // 花雷（鋭い雷鳴のような火花発光）
                    for (let i = 0; i < 80; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 6;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, '#ffffff', 'hanarai', {
                            friction: 0.92,
                            gravity: 0.08,
                            decay: 0.025,
                            trailLength: 3,
                            size: 2,
                            sparkle: true
                        }));
                    }
                    break;

                case 'yanagi': // 柳（彩色柳・色鮮やかにゆっくり垂れ下がる）
                    for (let i = 0; i < 85; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 2 + Math.random() * 3.5;
                        particles.push(new Particle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, color1, 'yanagi', {
                            friction: 0.97,
                            gravity: 0.035,
                            decay: 0.009,
                            trailLength: 12,
                            size: 2.2
                        }));
                    }
                    break;
            }
        }

        // メインループ
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let i = fireworks.length - 1; i >= 0; i--) {
                let fw = fireworks[i];
                fw.draw();
                if (fw.update()) {
                    fireworks.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
