    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
        .shake-animation {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between">

            </h1>
            <button id="reset-btn" onclick="resetData()" class="text-xs bg-slate-700 hover:bg-red-700 text-slate-300 hover:text-white px-3 py-1.5 rounded transition font-medium border border-slate-600">

    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-3xl w-full mx-auto p-4 md:p-6 flex-grow flex flex-col justify-center">
        <div id="app" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-2xl relative overflow-hidden">

        </div>

    <!-- フッター -->

    <script>
        // シナリオデータ（全5フェーズ）
        const phases = [
            {

                choices: [

                    },
                    {

                        isCorrect: true,

            },
            {
                id: 2,
                title: "【フェーズ2：初日・昼〜夕方（数時間後）】",
                subtitle: "家族の安否確認、情報収集、生活インフラ確認",

                choices: [
                    {
                        text: "すぐに自宅を飛び出し、家族がいる場所へ向けて歩いて迎えに行ったり、状況を確認しに出発する。",

                        isCorrect: false,
                        score: 10,
                        merit: "バッテリーの節約",
                        risk: "【NGリスク】真っ暗な状態で夜中に余震や避難が必要になった際、散乱したガラス片や家具で大怪我をしたり、避難遅れにつながります。",

                ]
            },
            {
                id: 4,
                title: "【フェーズ4：2日目（24〜48時間）】",
                subtitle: "食料・水の配分、衛生管理、デマ情報の見極め",
                situation: "被災から1日以上が経過しました。備蓄の消費が始まり、トイレの処理やゴミ・臭い問題、SNSでの不穏なデマ情報が飛び交い、精神的・衛生的なストレスがピークに達しつつあります。",
                choices: [
                    {
                        text: "SNSで流れてきた「〇〇で大量の水が無料配布されている」という真偽不明の情報を信じ、確認もせずすぐに現地へ向かう。",

                        isCorrect: true,
                        score: 20,
                        merit: "脱水症状や栄養失調を防ぎ、感染症リスクや悪臭を完全にシャットアウトできる。",

                    },

                        text: "水道が使えないので、我慢して水分摂取を極力控え、トイレに行く回数を減らそうとする。",
                        isCorrect: false,

                        merit: "トイレや水分の節約のつもり",
                        risk: "【NGリスク】水分を控えると、エコノミークラス症候群や熱中症、脱水症状を引き起こし、命に関わる深刻な健康被害を招きます。",

            {

                situation: "「72時間の壁」の最終局面です。公的な救助活動や給水車が徐々に動き出していますが、心身ともに疲労が蓄積し、蓄えていた水や食料も底をつきかけています。",
                choices: [
                    {
                        text: "完全に物資がゼロになるまで誰にも相談せず、一人で耐え忍んで救助を待ち続ける。",
                        isCorrect: false,

                        merit: "他人に迷惑をかけまいとする忍耐力",
                        risk: "【NGリスク】限界を超えて孤立すると、低栄養や脱水、精神的追い詰めによるパニックを引き起こします。",
                        advice: "孤立は危険です。近隣住民と声を掛け合い（共助）、自治体の給水所や炊き出しの情報を確認しましょう。"
                    },
                    {
                        text: "近所の方と安否や情報を共有し合い（共助）、自治体が開設した給水所や炊き出し、避難所の情報を確認して必要な支援を受ける。",
                        isCorrect: true,

                    },
                    {
                        text: "自宅の備蓄が尽きたため、近所の空き家や商店のシャッターを破って食料や飲料水を調達する。",

                        score: 0,
                        merit: "食料を手に入れる手段",
                        risk: "【NGリスク】窃盗・略奪行為にあたり、法的な処罰の対象となるだけでなく、地域社会での信頼を失います。",
                        advice: "いかに切羽詰まっていても違法行為は絶対にNGです。公的な配給や炊き出し、避難所を活用しましょう。"
                    }
                ]
            }
        ];

        // アプリの状態管理
        let gameState = {
            step: 'input',
            userConfig: {
                location: '自宅（マンション中層階）',
                people: '家族3人',
                placeType: '都市部の住宅街・室内',
                condition: '一般的な備蓄（水・非常食が数日分）あり',
                customText: ''
            },
            currentPhaseIndex: 0,
            totalScore: 0,
            history: []
        };

        // ローカルストレージから状態を復元
        function loadState() {
            const saved = localStorage.getItem('bousai_game_state');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse saved state', e);
                }
            }
            render();
        }

        // 状態をローカルストレージに保存
        function saveState() {
            localStorage.setItem('bousai_game_state', JSON.stringify(gameState));
        }

        // データをリセット（初期画面へ完全に戻す）
        function resetData() {
            if (confirm('シミュレーションのデータをリセットして、最初（状況の入力）からやり直しますか？')) {
                localStorage.removeItem('bousai_game_state');
                gameState = {
                    step: 'input',
                    userConfig: {
                        location: '自宅（マンション中層階）',
                        people: '家族3人',
                        placeType: '都市部の住宅街・室内',
                        condition: '一般的な備蓄（水・非常食が数日分）あり',
                        customText: ''
                    },
                    currentPhaseIndex: 0,
                    totalScore: 0,
                    history: []
                };
                // フェーズの選択状態もリセット
                phases.forEach(p => {
                    p.selectedChoice = null;
                    p.selectedChoiceIndex = null;
                    p.shuffledChoices = null;
                });
                render();
            }
        }

        // 画面描画ルーター
        function render() {
            const app = document.getElementById('app');
            if (gameState.step === 'input') {
                app.innerHTML = renderInputScreen();
            } else if (gameState.step === 'playing') {
                app.innerHTML = renderPlayingScreen();
            } else if (gameState.step === 'result') {
                app.innerHTML = renderResultScreen();
            }
        }

        // 1. 初期ヒアリング画面のHTML
        function renderInputScreen() {
            return `
                <div class="space-y-6">
                    <div class="border-b border-slate-700 pb-4">
                        <h2 class="text-xl font-bold text-red-400 flex items-center gap-2">
                            <span>🏠</span> あなたの被災環境設定
                        </h2>
                        <p class="text-sm text-slate-300 mt-1">
                            リアルなシミュレーションを行うため、現在のあなたのおおまかな状況を選択・入力してください。
                        </p>
                    </div>

                    <form id="config-form" onsubmit="startSimulation(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-200 mb-1">① 今どこで、どのような場所にいますか？</label>
                            <select id="cfg-location" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:ring-2 focus:ring-red-500">
                                <option value="自宅（戸建て）" ${gameState.userConfig.location === '自宅（戸建て）' ? 'selected' : ''}>自宅（戸建て）</option>
                                <option value="自宅（マンション中・高層階）" ${gameState.userConfig.location === '自宅（マンション中・高層階）' ? 'selected' : ''}>自宅（マンション中・高層階）</option>
                                <option value="職場・オフィスビル" ${gameState.userConfig.location === '職場・オフィスビル' ? 'selected' : ''}>職場・オフィスビル</option>
                                <option value="外出先（街中・駅周辺）" ${gameState.userConfig.location === '外出先（街中・駅周辺）' ? 'selected' : ''}>外出先（街中・駅周辺）</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-200 mb-1">② 誰と一緒ですか？</label>
                            <select id="cfg-people" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:ring-2 focus:ring-red-500">
                                <option value="一人（単身）" ${gameState.userConfig.people === '一人（単身）' ? 'selected' : ''}>一人（単身）</option>
                                <option value="家族（子供や配偶者）と一緒" ${gameState.userConfig.people === '家族（子供や配偶者）と一緒' ? 'selected' : ''}>家族（子供や配偶者）と一緒</option>
                                <option value="家族とは離れている" ${gameState.userConfig.people === '家族とは離れている' ? 'selected' : ''}>家族とは離れている（一人で被災）</option>
                                <option value="同僚・知人と一緒" ${gameState.userConfig.people === '同僚・知人と一緒' ? 'selected' : ''}>同僚・知人と一緒</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-200 mb-1">③ 現在の状態・備蓄の状況は？</label>
                            <select id="cfg-condition" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:ring-2 focus:ring-red-500">
                                <option value="水・食料・防災グッズの備蓄が数日分ある" ${gameState.userConfig.condition.includes('数日分') ? 'selected' : ''}>水・食料・防災グッズの備蓄が数日分ある</option>
                                <option value="ほとんど備蓄がない状態" ${gameState.userConfig.condition.includes('ほとんど') ? 'selected' : ''}>ほとんど備蓄がない状態</option>
                                <option value="十分な防災対策と備蓄（1週間分以上）がある" ${gameState.userConfig.condition.includes('1週間分') ? 'selected' : ''}>十分な防災対策と備蓄（1週間分以上）がある</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-200 mb-1">④ カスタムメモ（任意：気になることや追加したい状況など）</label>
                            <input type="text" id="cfg-custom" value="${gameState.userConfig.customText || ''}" placeholder="例：ペットがいる、足が少し悪い、など" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 text-sm focus:ring-2 focus:ring-red-500">
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2 text-base">
                                <span>🚨</span> サバイバルシミュレーションを開始する
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function startSimulation(e) {
            e.preventDefault();
            gameState.userConfig.location = document.getElementById('cfg-location').value;
            gameState.userConfig.people = document.getElementById('cfg-people').value;
            gameState.userConfig.condition = document.getElementById('cfg-condition').value;
            gameState.userConfig.customText = document.getElementById('cfg-custom').value;

            gameState.step = 'playing';
            gameState.currentPhaseIndex = 0;
            gameState.totalScore = 0;
            gameState.history = [];
            
            // 各フェーズのリセット
            phases.forEach(p => {
                p.selectedChoice = null;
                p.selectedChoiceIndex = null;
                p.shuffledChoices = null;
            });

            saveState();
            render();
            triggerShake();
        }

        function triggerShake() {
            const app = document.getElementById('app');
            app.classList.add('shake-animation');
            setTimeout(() => {
                app.classList.remove('shake-animation');
            }, 600);
        }

        // 2. プレイ中画面のHTML
        function renderPlayingScreen() {
            const phase = phases[gameState.currentPhaseIndex];
            if (!phase.selectedChoice) {
                if (!phase.shuffledChoices) {
                    let indices = [0, 1, 2];
                    for (let i = indices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [indices[i], indices[j]] = [indices[j], indices[i]];
                    }
                    phase.shuffledChoices = indices;
                }

                const labels = ['A', 'B', 'C'];
                let choicesHtml = '';
                phase.shuffledChoices.forEach((origIdx, displayIdx) => {
                    const choice = phase.choices[origIdx];
                    choicesHtml += `
                        <button onclick="answerChoice(${origIdx})" class="w-full text-left bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-xl p-4 transition shadow flex items-start gap-3 group">
                            <span class="bg-red-600 text-white font-bold px-3 py-1 rounded-lg text-sm flex-shrink-0 group-hover:bg-red-500">${labels[displayIdx]}</span>
                            <span class="text-sm md:text-base text-slate-100 leading-relaxed">${choice.text}</span>
                        </button>
                    `;
                });

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                            <span class="text-xs bg-red-900/60 text-red-300 border border-red-700 px-2.5 py-1 rounded-full font-semibold">フェーズ ${phase.id} / 5</span>
                            <span class="text-xs text-slate-400">現在地: ${gameState.userConfig.location}</span>
                        </div>

                        <div>
                            <h2 class="text-lg md:text-xl font-bold text-red-400">${phase.title}</h2>
                            <p class="text-xs text-slate-400 mt-0.5">${phase.subtitle}</p>
                        </div>

                        <div class="bg-slate-900/80 border border-slate-700/80 rounded-xl p-4 text-sm md:text-base text-slate-200 leading-relaxed space-y-2">
                            <p>${phase.situation}</p>
                            <p class="text-xs text-amber-300/90 italic pt-1">💡 あなたの状況（${gameState.userConfig.people} / 状態: ${gameState.userConfig.condition}）を踏まえて最も適切な行動を選択してください。</p>
                        </div>

                        <div class="space-y-3">
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">あなたの行動を選択してください（3択）:</p>
                            ${choicesHtml}
                        </div>
                    </div>
                `;
            } else {
                const selected = phase.choices[phase.selectedChoiceIndex];
                const isCorrect = selected.isCorrect;

                return `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                            <span class="text-xs bg-red-900/60 text-red-300 border border-red-700 px-2.5 py-1 rounded-full font-semibold">フェーズ ${phase.id} / 5 判定結果</span>
                            <span class="text-xs text-slate-400">獲得スコア: ${selected.score}点</span>
                        </div>

                        <div class="p-4 rounded-xl border ${isCorrect ? 'bg-emerald-950/40 border-emerald-600/50' : 'bg-red-950/40 border-red-600/50'}">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xl">${isCorrect ? '⭕' : '❌'}</span>
                                <h3 class="font-bold text-base ${isCorrect ? 'text-emerald-400' : 'text-red-400'}">
                                    ${isCorrect ? '正解！的確な判断です' : '危険な選択です（NGトラップ）'}
                                </h3>
                            </div>
                            <p class="text-sm text-slate-200 font-medium mb-3">選んだ行動：${selected.text}</p>
                            
                            <div class="space-y-2 text-xs md:text-sm pt-2 border-t border-slate-700/60">
                                <p class="text-slate-300"><strong class="text-emerald-400">メリット・評価:</strong> ${selected.merit}</p>
                                <p class="text-slate-300"><strong class="text-red-400">潜むリスク（NG要因）:</strong> ${selected.risk}</p>
                                <p class="text-slate-300 bg-slate-900/60 p-3 rounded-lg mt-2 border border-slate-700"><strong class="text-amber-300">防災トレーナーの教訓:</strong> ${selected.advice}</p>
                            </div>
                        </div>

                        <button onclick="nextPhase()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-xl shadow transition text-center text-sm md:text-base border border-slate-600 flex items-center justify-center gap-2">
                            <span>➡️</span> 次のフェーズへ進む
                        </button>
                    </div>
                `;
            }
        }

        function answerChoice(origIdx) {
            const phase = phases[gameState.currentPhaseIndex];
            phase.selectedChoiceIndex = origIdx;
            phase.selectedChoice = phase.choices[origIdx];
            gameState.totalScore += phase.selectedChoice.score;
            saveState();
            render();
        }

        function nextPhase() {
            gameState.currentPhaseIndex++;
            if (gameState.currentPhaseIndex >= phases.length) {
                gameState.step = 'result';
            }
            saveState();
            render();
        }

        // 3. 最終結果画面のHTML
        function renderResultScreen() {
            let rankTitle = '';
            let rankDesc = '';
            const score = gameState.totalScore;

            if (score >= 90) {
                rankTitle = '🏆 サバイバルマスター（極めて高い生存力）';
                rankDesc = '素晴らしい判断力です！二次災害のリスクを正確に見抜き、自身の命と周囲の安全をしっかりと守り抜くことができます。';
            } else if (score >= 70) {
                rankTitle = '🛡️ 防災セーフティリーダー（十分な生存力）';
                rankDesc = '全体を通して冷静な判断ができています。いくつかのNGトラップに注意すれば、72時間を十分に生き抜くことができます。';
            } else if (score >= 40) {
                rankTitle = '⚠️ 要・防災見直しレベル（注意が必要）';
                rankDesc = 'いくつかの選択で二次災害のリスクやNG行動を踏んでしまいました。「知っている」から「動ける」への意識改革と備えの再確認がおすすめです。';
            } else {
                rankTitle = '🚨 危険信号：命を守る見直しが急務';
                rankDesc = 'パニック状態でのNG行動が多く見られました。発災時の行動手順や通信・トイレ・火災対策について、今一度ご家族と確認しましょう。';
            }

            return `
                <div class="space-y-6 text-center">
                    <div class="border-b border-slate-700 pb-4">
                        <span class="text-xs bg-red-900/60 text-red-300 border border-red-700 px-3 py-1 rounded-full font-semibold">72時間サバイバル訓練 終了</span>
                        <h2 class="text-2xl font-bold text-slate-100 mt-2">総合生存力スコア</h2>
                        <div class="text-5xl font-black text-red-500 my-3">${score} <span class="text-lg text-slate-400">/ 100点</span></div>
                    </div>

                    <div class="bg-slate-900/80 border border-slate-700 p-5 rounded-xl text-left space-y-3">
                        <h3 class="font-bold text-amber-400 text-base">${rankTitle}</h3>
                        <p class="text-sm text-slate-300 leading-relaxed">${rankDesc}</p>
                        <div class="text-xs text-slate-400 pt-2 border-t border-slate-700/60 space-y-1">
                            <p><strong>あなたの設定：</strong> ${gameState.userConfig.location} / ${gameState.userConfig.people} / 状態: ${gameState.userConfig.condition}</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 pt-2">
                        <button onclick="copyResult()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded-xl shadow transition text-sm border border-slate-600 flex items-center justify-center gap-2">
                            <span>📋</span> 結果をクリップボードにコピー
                        </button>
                        <button onclick="resetData()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                            <span>🔄</span> 最初からやり直す
                        </button>
                    </div>

                    <div class="pt-4 border-t border-slate-700 text-left text-xs text-slate-400 space-y-2">
                        <p class="font-semibold text-slate-300">📚 公的な防災情報の確認・参考リンク:</p>
                        <ul class="list-disc pl-5 space-y-1">
                            <li><a href="https://www.kantei.go.jp/jp/headline/bousai/sonae.html" target="_blank" class="text-blue-400 hover:underline">首相官邸 - 災害に対するご家庭での備え</a></li>
                            <li><a href="https://www.bousai.metro.tokyo.lg.jp/" target="_blank" class="text-blue-400 hover:underline">東京都防災ホームページ（東京防災など）</a></li>
                            <li><a href="https://www.jma.go.jp/jma/index.html" target="_blank" class="text-blue-400 hover:underline">気象庁 - 防災情報・地震情報</a></li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function copyResult() {
            const text = `【防災サバイバルシミュレーション結果】\n総合スコア: ${gameState.totalScore}/100点\n環境: ${gameState.userConfig.location} / ${gameState.userConfig.people}\n#防災 #72時間の壁 #サバイバルシミュレーション`;
            navigator.clipboard.writeText(text).then(() => {
                alert('結果をクリップボードにコピーしました！');
            });
        }

        // ページロード時
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
        });
    </script>
</body>
</html>
